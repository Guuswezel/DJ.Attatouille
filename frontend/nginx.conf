server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
  }

  location /media/ {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
  }

  location /library/ {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
